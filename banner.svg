<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Rodrigo Cruz, Tech Lead, SaaS y Ciberseguridad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0f2236"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <rect width="1200" height="260" fill="url(#glow)"/>

    <!-- línea de luz que recorre la base -->
    <rect x="-400" y="252" width="400" height="3" fill="url(#line)">
      <animate attributeName="x" from="-400" to="1200" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- detalle tipo terminal -->
    <text x="60" y="62" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="18" fill="#38bdf8" fill-opacity="0.85">~/rod14x $ whoami</text>

    <text x="60" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff">Rodrigo Cruz</text>

    <text x="62" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#38bdf8">Tech Lead · SaaS &amp; Ciberseguridad</text>

    <text x="62" y="212" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="19" fill="#cbd5e1">Ingeniería primero; la IA, mi equipo.</text>

    <!-- insignia derecha -->
    <g transform="translate(960,70)" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.9">
      <path d="M90 0 L170 30 V90 C170 135 135 165 90 182 C45 165 10 135 10 90 V30 Z" stroke-opacity="0.9"/>
      <path d="M55 92 L82 120 L128 66" stroke="#ffffff" stroke-opacity="0.95"/>
    </g>
  </g>
</svg>
